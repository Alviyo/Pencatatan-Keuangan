<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="28" fill="#0f172a" />
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="#1e293b" stroke-width="2" />
  
  <!-- Modern Geometric Wallet / Money Growth Icon -->
  <rect x="22" y="28" width="56" height="46" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" />
  <path d="M22 42 H78" stroke="#047857" stroke-width="3" />
  
  <!-- Card flap / clasp -->
  <path d="M58 43 H76 C79 43 81 45.5 81 48.5 V53.5 C81 56.5 79 59 76 59 H58 Z" fill="#064e3b" />
  <circle cx="68" cy="51" r="3.5" fill="url(#accentGrad)" />
  
  <!-- Rising Coin / Sparkle -->
  <circle cx="50" cy="24" r="9" fill="url(#accentGrad)" />
  <path d="M50 19 V29 M47 22 H53 M47 26 H53" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
</svg>